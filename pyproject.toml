[project]
name = "ecommerce-api"
version = "0.1.0"
description = "Multi-vendor e-commerce API (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
]

[dependency-groups]
# load-test tools; installed only with: uv sync --group loadtest
loadtest = [
    "locust>=2.29",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "psutil>=5.9",
]
